<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fides</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f2; --surface: #ffffff; --border: #e0ddd6; --text: #1a1917;
      --muted: #7a7870; --accent: #1a1917; --accent-hover: #3a3835;
      --error: #c0392b; --success: #1d6a45;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: url("images/plane.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 0; }

    .container { width: 100%; max-width: 420px; position: relative; z-index: 1; }

    .wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem; color: #ffffff; text-align: center;
      margin-bottom: 0.25rem; letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .tagline {
      text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.85);
      letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 2.5rem;
      font-weight: 400; text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.75rem; }

    .tab {
      flex: 1; background: none; border: none; padding: 0.6rem 0;
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 400;
      color: var(--muted); cursor: pointer; position: relative; transition: color 0.2s;
    }
    .tab.active { color: var(--text); font-weight: 500; }
    .tab.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 1.5px; background: var(--text);
    }

    .form-group { margin-bottom: 1.1rem; }

    label {
      display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border);
      border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--text); background: #fff; }

    /* Role toggle */
    .role-toggle { display: flex; gap: 0.5rem; margin-bottom: 1.1rem; }
    .role-btn {
      flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .role-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    .manager-select { display: none; }
    .manager-select.visible { display: block; }

    .btn {
      width: 100%; padding: 0.75rem; margin-top: 0.5rem;
      background: var(--accent); color: #fff; border: none; border-radius: 7px;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .message { margin-top: 1rem; padding: 0.65rem 0.85rem; border-radius: 7px; font-size: 0.83rem; display: none; }
    .message.error { background: #fdf0ef; color: var(--error); border: 1px solid #f5c6c2; display: block; }
    .message.success { background: #edf7f1; color: var(--success); border: 1px solid #b8e2ca; display: block; }

    .search-box {
      width: 100%; padding: 0.55rem 0.85rem; border: 1px solid var(--border);
      border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
      color: var(--text); background: var(--bg); outline: none; margin-bottom: 0.5rem;
    }
    .manager-list {
      max-height: 160px; overflow-y: auto; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg);
    }
    .manager-item {
      padding: 0.6rem 0.85rem; cursor: pointer; font-size: 0.87rem;
      transition: background 0.12s; border-bottom: 1px solid var(--border);
    }
    .manager-item:last-child { border-bottom: none; }
    .manager-item:hover { background: #f0ede8; }
    .manager-item.selected { background: var(--accent); color: #fff; }
    .manager-item .mgr-email { font-size: 0.73rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <div class="wordmark">Fides</div>
    <div class="tagline">Your travel companion</div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign in</button>
        <button class="tab" onclick="switchTab('register')">Create account</button>
      </div>

      <!-- LOGIN -->
      <div id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••"/>
        </div>
        <button class="btn" onclick="handleLogin()">Sign in</button>
        <div class="message" id="login-msg"></div>
      </div>

      <!-- REGISTER -->
      <div id="register-form" style="display:none;">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••"/>
        </div>

        <label style="margin-bottom:0.4rem;">I am a</label>
        <div class="role-toggle">
          <div class="role-btn selected" id="role-employee" onclick="selectRole('employee')">👤 Employee</div>
          <div class="role-btn" id="role-manager" onclick="selectRole('manager')">🏢 Manager</div>
        </div>

        <!-- Only shown for employees -->
        <div class="manager-select" id="manager-select-wrap">
          <label>Select your manager</label>
          <input class="search-box" type="text" id="manager-search" placeholder="Search by name or email…" oninput="filterManagers()"/>
          <div class="manager-list" id="manager-list">
            <div style="padding:0.75rem;font-size:0.82rem;color:var(--muted);">Loading managers…</div>
          </div>
          <input type="hidden" id="selected-manager-id"/>
        </div>

        <button class="btn" onclick="handleRegister()" style="margin-top:1rem;">Create account</button>
        <div class="message" id="reg-msg"></div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api/auth';
    let selectedRole = 'employee';
    let allManagers = [];
    let selectedManagerId = null;

    function switchTab(tab) {
      const tabs = document.querySelectorAll('.tab');
      tabs[0].classList.toggle('active', tab === 'login');
      tabs[1].classList.toggle('active', tab === 'register');
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      if (tab === 'register') loadManagers();
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('role-employee').classList.toggle('selected', role === 'employee');
      document.getElementById('role-manager').classList.toggle('selected', role === 'manager');
      const wrap = document.getElementById('manager-select-wrap');
      wrap.classList.toggle('visible', role === 'employee');
    }

    async function loadManagers() {
      try {
        const res = await fetch('http://localhost:3000/api/auth/managers-public');
        const data = await res.json();
        allManagers = data.managers || [];
        renderManagers(allManagers);
      } catch {
        document.getElementById('manager-list').innerHTML =
          '<div style="padding:0.75rem;font-size:0.82rem;color:var(--muted);">Could not load managers.</div>';
      }
    }

    function renderManagers(list) {
      const el = document.getElementById('manager-list');
      if (!list.length) {
        el.innerHTML = '<div style="padding:0.75rem;font-size:0.82rem;color:var(--muted);">No managers registered yet.</div>';
        return;
      }
      el.innerHTML = list.map(m => `
        <div class="manager-item${selectedManagerId === m._id ? ' selected' : ''}"
             onclick="pickManager('${m._id}', this)"
             data-name="${(m.displayName || '').toLowerCase()}"
             data-email="${m.email.toLowerCase()}">
          <div>${m.displayName || m.email}</div>
          <div class="mgr-email">${m.email}</div>
        </div>`).join('');
    }

    function filterManagers() {
      const q = document.getElementById('manager-search').value.toLowerCase();
      const filtered = allManagers.filter(m =>
        (m.displayName || '').toLowerCase().includes(q) || m.email.toLowerCase().includes(q)
      );
      renderManagers(filtered);
    }

    function pickManager(id, el) {
      selectedManagerId = id;
      document.getElementById('selected-manager-id').value = id;
      document.querySelectorAll('.manager-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return showMsg('login-msg', 'Please fill in all fields.', 'error');

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showMsg('login-msg', data.error || 'Login failed.', 'error');

        sessionStorage.setItem('token', data.token);
        showMsg('login-msg', 'Signed in successfully.', 'success');
        setTimeout(() => window.location.href = '/home.html', 1000);
      } catch {
        showMsg('login-msg', 'Could not reach the server. Is it running?', 'error');
      }
    }

    async function handleRegister() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!email || !password) return showMsg('reg-msg', 'Please fill in all fields.', 'error');
      if (selectedRole === 'employee' && !selectedManagerId) {
        return showMsg('reg-msg', 'Please select your manager.', 'error');
      }

      const body = { email, password, role: selectedRole };
      if (selectedRole === 'employee' && selectedManagerId) body.managerId = selectedManagerId;

      try {
        const res = await fetch(`${API}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) return showMsg('reg-msg', data.error || 'Registration failed.', 'error');

        showMsg('reg-msg', 'Account created. You can now sign in.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } catch {
        showMsg('reg-msg', 'Could not reach the server. Is it running?', 'error');
      }
    }
  </script>
</body>
</html>
